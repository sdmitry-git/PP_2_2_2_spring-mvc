<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car List</title>
    <style>
        table, th,  td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <h1>Car List</h1>
    <table>
        <tr>
            <th>Model</th>
            <th>Age</th>
            <th>Price</th>
        </tr>
        <tr th:each="car : ${cars}">
            <td th:text="${car.model}"></td>
            <td th:text="${car.age}"></td>
            <td th:text="${car.price}"></td>
        </tr>
    </table>
</body>
</html>
